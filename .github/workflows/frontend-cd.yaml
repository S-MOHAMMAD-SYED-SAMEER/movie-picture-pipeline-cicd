cat > .github/workflows/frontend-cd.yaml <<'EOF'
name: Frontend Continuous Deployment

on:
  push:
    branches: [main]
    paths:
      - 'starter/frontend/**'
  workflow_dispatch:

defaults:
  run:
    working-directory: starter/frontend

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '18.14'
          cache: npm
          cache-dependency-path: starter/frontend/package-lock.json

      - run: npm ci
      - run: npm run lint

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '18.14'
          cache: npm
          cache-dependency-path: starter/frontend/package-lock.json

      - run: npm ci
      - run: CI=true npm test

  deploy:
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Configure kubectl
        run: aws eks update-kubeconfig --name cluster --region us-east-1

      - name: Get backend URL
        id: backend
        run: |
          BACKEND_HOST=$(kubectl get svc backend -o jsonpath='{.status.loadBalancer.ingress[0].hostname}')
          echo "url=http://${BACKEND_HOST}" >> "$GITHUB_OUTPUT"

      - name: Build frontend image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          BACKEND_URL: ${{ steps.backend.outputs.url }}
        run: |
          docker build \
            --build-arg=REACT_APP_MOVIE_API_URL="${BACKEND_URL}" \
            --tag "${ECR_REGISTRY}/frontend:${{ github.sha }}" \
            .

      - name: Push frontend image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: docker push "${ECR_REGISTRY}/frontend:${{ github.sha }}"

      - name: Deploy frontend
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          cd k8s
          kustomize edit set image frontend="${ECR_REGISTRY}/frontend:${{ github.sha }}"
          kustomize build | kubectl apply -f -
          kubectl rollout status deployment/frontend --timeout=120s
          kubectl get svc frontend
EOF